apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentd
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentd
rules:
  # Watch and update SandboxSnapshotTasks assigned to this node.
  - apiGroups: ["runtime.agentcube.volcano.sh"]
    resources: ["sandboxsnapshottasks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["runtime.agentcube.volcano.sh"]
    resources: ["sandboxsnapshottasks/status"]
    verbs: ["get", "update", "patch"]
  # Watch Sandboxes (build and session lifecycle).
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Patch node labels for snapshot-provider capability advertisement,
  # and read node info for capability checks.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # Get Pod UID via direct API call (APIReader bypasses cache, no list/watch needed).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # Publish events on SandboxSnapshotTask objects.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentd
subjects:
  - kind: ServiceAccount
    name: agentd
    namespace: {{ .Release.Namespace }}
